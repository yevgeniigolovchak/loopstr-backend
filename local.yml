services:
  db:
    image: postgres:17.9-alpine
    networks:
      - db
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - docker/db/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile_local
    networks:
      - backend
      - db
    volumes:
      - ./:/app
    command: |
      /usr/bin/env sh -c "python manage.py migrate
        python manage.py runserver 0.0.0.0:8000"
    env_file:
      - docker/app/.env
      - docker/db/.env
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy

networks:
  db:
    driver: bridge
  backend:
    driver: bridge

volumes:
  pgdata:
    name: loopstr_db
    driver: local
